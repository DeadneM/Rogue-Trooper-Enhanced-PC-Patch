name: Build V64 patcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build Windows x64 patcher
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o RogueTrooper_Patcher_V64.exe ./patcher

      - name: Print SHA-256
        run: sha256sum RogueTrooper_Patcher_V64.exe

      - name: Upload patcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogueTrooper_Patcher_V64
          path: RogueTrooper_Patcher_V64.exe
          if-no-files-found: error
